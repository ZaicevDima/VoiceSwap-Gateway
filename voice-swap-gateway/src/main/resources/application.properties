spring.application.name=voice-swap-gateway
server.port=8081

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}/voiceswap/


spring.config.import=\
  classpath:application-asr.properties,\
  classpath:application-audio.properties,\
  classpath:application-file-storage.properties,\
  classpath:application-video.properties,\
  classpath:application-voice-cloner.properties
